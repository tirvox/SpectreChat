<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7b2ff2"/>
      <stop offset="50%" style="stop-color:#c084fc"/>
      <stop offset="100%" style="stop-color:#7b2ff2"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#7b2ff2" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- Spectre S shape -->
  <g filter="url(#shadow)">
    <path d="M 340 140 
             C 340 140, 380 140, 380 180 
             C 380 220, 300 220, 280 240 
             C 260 260, 380 270, 380 320 
             C 380 370, 320 380, 280 380 
             C 240 380, 180 360, 180 320"
          stroke="url(#glow)" stroke-width="40" stroke-linecap="round" fill="none"/>
  </g>
  
  <!-- Eye / Ghost element -->
  <circle cx="310" cy="255" r="12" fill="#c084fc" opacity="0.9"/>
  
  <!-- Text -->
  <text x="256" y="460" font-family="Arial, sans-serif" font-size="48" font-weight="bold" 
        fill="url(#glow)" text-anchor="middle" letter-spacing="8">SPECTRE</text>
</svg>
